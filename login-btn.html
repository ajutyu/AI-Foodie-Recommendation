<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Planner - Login</title>

    <link rel="stylesheet" href="style17.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
               <img src="IMG_20260801_160643.png" alt>
            </div>

            <h1>AI Food Recommendation
                   & Recipe Generator</h1>
            <p class="subtitle">Plan your perfect journey with AI</p>

            <form id="loginForm">

                <div class="input-group">
                    <label>Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Enter your email"
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password"
                    >
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Login</button>

                <p id="message"></p>

            </form>

            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>, initial-scale=1.0">
